name: Bypass Health Check

on:
  schedule:
    # Run at 00:00 every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Health Check (Auto-Delete Dead Bypasses)
        run: npx tsx scripts/health-check.ts --auto-delete

      - name: Create Pull Request for Dead Bypasses
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: remove dead bypass modules'
          title: 'Automated Cleanup: Remove Dead Bypasses'
          body: |
            This PR was automatically generated by the Bypass Health Check workflow.
            It removes bypass modules where **all associated domains** are no longer reachable (dead).
            
            Please review the removed files.
          branch: auto/dead-bypasses
          delete-branch: true
          labels: maintenance, automated
