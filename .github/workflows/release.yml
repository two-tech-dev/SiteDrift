name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: 'Trigger message (e.g. "release v1.0.0" or "prerelease v1.0.0")'
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.parse.outputs.should_run }}
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse commit or dispatch message
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MSG="${{ github.event.inputs.message }}"
          else
            MSG="${{ github.event.head_commit.message }}"
          fi

          if echo "$MSG" | grep -qiE '^release v[0-9]+\.[0-9]+(\.[0-9]+)?'; then
            VERSION=$(echo "$MSG" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?')
            echo "should_run=true"  >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -qiE '^prerelease v[0-9]+\.[0-9]+(\.[0-9]+)?'; then
            VERSION=$(echo "$MSG" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?')
            echo "should_run=true"  >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "prerelease=true"  >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  release:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package dist as zip
        run: |
          cd dist
          zip -r ../SiteDrift_${{ needs.check.outputs.version }}_chromium.zip . -x ".vite/*"
          cd ..
          cp -r dist dist-firefox
          cd dist-firefox
          jq '.background.scripts = [.background.service_worker] | del(.background.service_worker)' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          zip -r ../SiteDrift_${{ needs.check.outputs.version }}_firefox.xpi . -x ".vite/*"

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.check.outputs.version }}
          git push origin ${{ needs.check.outputs.version }}

      - name: Read changelog
        id: changelog
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          # Strip leading 'v' to match filename (e.g. v26.0.1 -> 26.0.1)
          FILE="changelogs/${VERSION#v}.md"
          if [ -f "$FILE" ]; then
            echo "body<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
            cat "$FILE" >> $GITHUB_OUTPUT
            echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT
          else
            echo "body=No changelog found for $VERSION." >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.version }}
          name: SiteDrift ${{ needs.check.outputs.version }}
          prerelease: ${{ needs.check.outputs.prerelease }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            SiteDrift_${{ needs.check.outputs.version }}_chromium.zip
            SiteDrift_${{ needs.check.outputs.version }}_firefox.xpi
