name: Update Supported Sites

on:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

jobs:
  update-supported-sites:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync supported sites data
        run: npm run sync-supported-sites

      - name: Create Pull Request for supported sites update
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update supported sites data'
          title: 'Automated Update: Supported Sites Directory'
          body: |
            This PR was automatically generated from bypass module `matches` exports.

            It updates `web/src/data/supportedSites.ts` so the public Supported Sites directory stays aligned with the extension code.
          branch: auto/update-supported-sites
          delete-branch: true
          labels: maintenance, automated
