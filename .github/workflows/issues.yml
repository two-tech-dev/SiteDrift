name: Close inactive issues
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          operations-per-run: 900
          stale-issue-label: 'stale'
          exempt-issue-labels: 'no stale,pinned'
          stale-issue-message: "This issue has been inactive for 30 days and will be closed soon. If it's still relevant, please leave a comment or join us on [Discord](https://discord.gg/DYeCKWP3jB)."
          close-issue-message: 'This issue was closed due to inactivity. Feel free to re-open if still relevant, or reach out on [Discord](https://discord.gg/DYeCKWP3jB).'
          days-before-pr-stale: 30
          days-before-pr-close: 14
          repo-token: ${{ secrets.GITHUB_TOKEN }}
